# =============================================================================
# dhcpd.conf — Servidor DHCP
# srv-dhcp-01 | SIG — Unidad de Víctimas | 10.0.10.6
# =============================================================================
# Subredes servidas:
#   VLAN 20 — Administración  : 10.0.20.0/24 (rango: .2 – .254)
#   VLAN 30 — Usuarios internos: 10.0.30.0/24 (rango: .2 – .254)
# =============================================================================

# Configuración global
default-lease-time 600;       # 10 minutos (entorno de pruebas)
max-lease-time 7200;          # 2 horas máximo
authoritative;                # Este servidor es autoritativo en la red

# Servidor DNS interno (srv-dns-01)
option domain-name "uv.local";
option domain-name-servers 10.0.40.3;

# Servidor NTP interno (srv-ntp-01)
option ntp-servers 10.0.10.4;

# =============================================================================
# VLAN 20 — Administración (10.0.20.0/24)
# Funcionarios y administradores de la Unidad de Víctimas
# =============================================================================
subnet 10.0.20.0 netmask 255.255.255.0 {
    range 10.0.20.2 10.0.20.254;
    option routers 10.0.20.1;
    option subnet-mask 255.255.255.0;
    option broadcast-address 10.0.20.255;

    # Lease más largo para equipos de administración
    default-lease-time 3600;
    max-lease-time 86400;
}

# =============================================================================
# VLAN 30 — Usuarios internos (10.0.30.0/24)
# Usuarios generales de la Unidad de Víctimas
# =============================================================================
subnet 10.0.30.0 netmask 255.255.255.0 {
    range 10.0.30.2 10.0.30.254;
    option routers 10.0.30.1;
    option subnet-mask 255.255.255.0;
    option broadcast-address 10.0.30.255;

    default-lease-time 600;
    max-lease-time 7200;
}

# =============================================================================
# VLAN 10 — Servidores (declarada pero sin rango dinámico)
# Los servidores tienen IPs estáticas — DHCP no asigna en este segmento
# =============================================================================
subnet 10.0.10.0 netmask 255.255.255.0 {
    # Sin range — solo declarada para que dhcpd reconozca la interfaz
}