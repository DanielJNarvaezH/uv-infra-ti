# =============================================================================
# smb.conf — Configuración Samba simplificada
# srv-files-01 | SIG — Unidad de Víctimas | 10.0.10.3
# =============================================================================

[global]
    workgroup = UV_SIG
    server string = Servidor de Archivos SIG
    server role = standalone server
    security = user
    map to guest = never

    # Solo SMB moderno
    server min protocol = SMB2
    server max protocol = SMB3
    disable netbios = yes
    smb ports = 445

    # Log básico
    log file = /var/log/samba/log.%m
    max log size = 1000
    log level = 1

    # Sin impresoras
    load printers = no
    printing = bsd
    printcap name = /dev/null

    dns proxy = no
    unix charset = UTF-8
    dos charset = CP850

[uv_docs]
    comment = Documentos institucionales SIG
    path = /srv/uv_docs
    browseable = yes
    read only = no
    guest ok = no
    valid users = uv_files_user
    force group = g_files
    create mask = 0660
    directory mask = 2770
    inherit permissions = yes
    inherit acls = yes