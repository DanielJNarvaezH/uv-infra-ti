global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: "uv-sig-lab"

scrape_configs:

  # Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Container metrics from cAdvisor
  - job_name: "cadvisor"
    static_configs:
      - targets: ["srv-cadvisor-01:8080"]   # resolves via Docker DNS on vlan10
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "srv-cadvisor-01"

  # You can add node_exporter later here for host-level metrics
  # - job_name: "node"
  #   static_configs:
  #     - targets: ["10.0.10.x:9100"]
