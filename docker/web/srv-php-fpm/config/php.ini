; ==========================================
; SEGURIDAD
; ==========================================
; Ocultar la versión de PHP en los headers HTTP (Crucial)
expose_php = Off

; Desactivar la ejecución de código remoto o inclusión de archivos HTTP
allow_url_fopen = Off
allow_url_include = Off

; Desactivar funciones peligrosas de PHP
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,curl_exec,curl_multi_exec,parse_ini_file,show_source

; Evitar vulnerabilidades con el ruteo de Nginx
cgi.fix_pathinfo = 0

; Sesiones seguras (obligar a usar HTTPS e impedir lectura por JS)
session.cookie_secure = 1
session.cookie_httponly = 1
session.use_strict_mode = 1

; ==========================================
; RENDIMIENTO Y RECURSOS
; ==========================================
; Limitar la memoria por script (ajústalo según tu app, 128M suele ser suficiente)
memory_limit = 128M

; Limitar tamaño de subida de archivos (ej. 10MB)
post_max_size = 10M
upload_max_filesize = 10M

; Tiempos máximos de ejecución
max_execution_time = 30
max_input_time = 30

; ==========================================
; MANEJO DE ERRORES (PRODUCCIÓN)
; ==========================================
; NUNCA mostrar errores en pantalla en producción (evita fuga de información)
display_errors = Off
display_startup_errors = Off

; Pero SÍ registrarlos en un archivo/consola para poder depurar
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; ==========================================
; OPTIMIZACIÓN DE OPCACHE (Caché de código compilado)
; ==========================================
opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
; En producción, no verificar cambios de archivos constantemente (mejora rendimiento)
opcache.validate_timestamps=0