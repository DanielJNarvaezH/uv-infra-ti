[www]
; Asegurarse de que los procesos corran sin privilegios root
user = www-data
group = www-data

; Escuchar en el puerto 9000 en todas las interfaces del contenedor
listen = 9000

; Gestión de procesos dinámicos
; "dynamic" es excelente para servidores con tráfico variable
pm = dynamic

; Cantidad máxima de procesos hijos (peticiones concurrentes)
; Ajusta según la RAM de tu servidor (ej. si cada proceso usa 30MB, 20 procesos usarán ~600MB)
pm.max_children = 20

; Cuántos procesos mantener "vivos" esperando peticiones al inicio
pm.start_servers = 5

; Mínimo de procesos inactivos de reserva
pm.min_spare_servers = 3

; Máximo de procesos inactivos de reserva
pm.max_spare_servers = 10

; Reciclar los procesos después de X peticiones (evita fugas de memoria, memory leaks)
pm.max_requests = 500

; Atrapar los errores de los workers y mandarlos al log principal de Docker
catch_workers_output = yes
decorate_workers_output = no

; Limpiar el entorno por seguridad (no pasar variables del sistema operativo al script)
clear_env = yes
