user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Ocultar la versión de Nginx por seguridad
    server_tokens off;

    # Optimizaciones de red
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # Configuración de compresión GZIP
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # ==========================================
    # REDIRECCIÓN HTTP A HTTPS Y CERTBOT
    # ==========================================
    server {
        listen 80;
        listen [::]:80;
        server_name unidadvictimas.gov.co www.unidadvictimas.gov.co;

        # Ruta necesaria para que Certbot pueda generar/renovar el certificado
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Redirigir todo el tráfico restante a HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================
    # CONFIGURACIÓN DEL SITIO HTTPS
    # ==========================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name unidadvictimas.gov.co www.unidadvictimas.gov.co;

        # Rutas a los certificados generados por Certbot
        ssl_certificate /etc/letsencrypt/live/unidadvictimas.gov.co/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/unidadvictimas.gov.co/privkey.pem;

        # Configuraciones de seguridad SSL/TLS recomendadas
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

        # ==========================================
        # ENCABEZADOS DE SEGURIDAD (SECURITY HEADERS)
        # ==========================================
        
        # HSTS: Fuerza el uso de HTTPS en los navegadores
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        
        # Evita ataques de Clickjacking
        add_header X-Frame-Options "SAMEORIGIN" always;
        
        # Evita que el navegador intente adivinar el tipo MIME
        add_header X-Content-Type-Options "nosniff" always;
        
        # Activa el filtro XSS del navegador
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Controla qué información de referencia se envía
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # CSP: Restringe desde dónde se pueden cargar recursos (Ajusta según tu app)
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'self';" always;
        
        # Limita el acceso a características del dispositivo (cámara, micrófono, etc.)
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

        # ==========================================
        # ENRUTAMIENTO PARA PHP (DINÁMICO)
        # ==========================================
        
        # El directorio raíz donde estarán tus archivos PHP (debe estar compartido entre los contenedores)
        root /var/www/html;
        index index.php index.html index.htm;

        # Intenta servir el archivo directamente, si no existe, manda la petición a index.php
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # Configuración para procesar los archivos PHP
        location ~ \.php$ {
            try_files $uri =404;
            # Manda la petición al contenedor de PHP-FPM en el puerto 9000
            fastcgi_pass srv-php-fpm:9000; 
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            
            # Ocultar la versión de PHP por seguridad
            fastcgi_hide_header X-Powered-By;
        }
    }
}