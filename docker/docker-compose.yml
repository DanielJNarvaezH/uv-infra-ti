# =============================================================================
# docker-compose.yml — Infraestructura TI SIG
# Unidad para la Atención y Reparación Integral a las Víctimas
# Universidad del Quindío — Semestre 2026-1
# =============================================================================
# Uso con Podman:
#   alias docker=podman
#   podman-compose up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # srv-ntp-01 — Servidor NTP (chrony) (VLAN 10 — 10.0.10.3)
  # ---------------------------------------------------------------------------
  srv-ntp-01:
    build:
      context: ./ntp/
      dockerfile: Dockerfile
    container_name: srv-ntp-01
    hostname: srv-ntp-01
    restart: unless-stopped
    networks:
      vlan_10:
        ipv4_address: 10.0.10.4
    expose:
      - "123"
    healthcheck:
      test: ["CMD-SHELL", "chronyc -n sources | grep '^*' >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # srv-php-fpm — Servidor PHP-FPM (VLAN 10 — 10.0.10.8)
  # ---------------------------------------------------------------------------
  srv-php-fpm:
    build:
      context: ./web/srv-php-fpm
      dockerfile: Dockerfile
    container_name: srv-php-fpm
    hostname: srv-php-fpm
    restart: unless-stopped
    networks:
      vlan_10:
        ipv4_address: 10.0.10.8
    expose:
      - "9000"
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # srv-certbot — Servidor Certbot (VLAN 10 — 10.0.10.9)
  # ---------------------------------------------------------------------------
  srv-certbot:
    image: certbot/certbot:latest
    container_name: srv-certbot
    hostname: srv-certbot
    restart: unless-stopped
    networks:
      vlan_10:
        ipv4_address: 10.0.10.9
    volumes:
      - ./web/certbot/www/:/var/www/certbot/:rw
      - ./web/certbot/conf/:/etc/letsencrypt/:rw
    # El comando por defecto verificará cada 12 horas si el certificado necesita renovación
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

  # ---------------------------------------------------------------------------
  # srv-db-01 — Servidor de Base de Datos (VLAN 10 — 10.0.10.2)
  # ---------------------------------------------------------------------------
  srv-db-01:
    build:
      context: ./db
      dockerfile: Dockerfile
    depends_on:
      srv-ntp-01:
        condition: service_healthy
    container_name: srv-db-01
    hostname: srv-db-01
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
      PGTZ: ${PGTZ}
    volumes:
      # Volumen persistente
      - pgdata:/var/lib/postgresql/data:Z
      # Scripts de init (read-only — solo se ejecutan en primer arranque)
      - ./db/init:/docker-entrypoint-initdb.d:ro,Z
    networks:
      vlan10:
        ipv4_address: 10.0.10.2
    # Puerto NO expuesto al host: solo accesible desde VLAN 10 y VLAN 20 (regla de firewall)
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # srv-files-01 — Servidor de Archivos (VLAN 10 — 10.0.10.3)
  # Samba SMB/CIFS | Share: /srv/uv_docs | Solo LAN, bloqueado desde DMZ
  # ---------------------------------------------------------------------------
  srv-files-01:
    build:
      context: ./files
      dockerfile: Dockerfile
      args:
        SAMBA_GID: ${SAMBA_GID:-1050}
        SAMBA_UID: ${SAMBA_UID:-1050}
    depends_on:
      srv-ntp-01:
        condition: service_healthy
    container_name: srv-files-01
    hostname: srv-files-01
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      SAMBA_USER: ${SAMBA_USER}
      SAMBA_PASSWORD: ${SAMBA_PASSWORD}
      SAMBA_GROUP: g_files
      SAMBA_SHARE_PATH: /srv/uv_docs
    volumes:
      - samba_data:/srv/uv_docs:Z
    networks:
      vlan10:
        ipv4_address: 10.0.10.3
    expose:
      - "445"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "testparm -s /etc/samba/smb.conf >/dev/null 2>&1 && pgrep smbd >/dev/null",
        ]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # srv-web-01 — Servidor Web (VLAN 40 — 10.0.40.2, VLAN 10 — 10.0.10.7)
  # ---------------------------------------------------------------------------
  srv-web-01:
    image: nginx:latest
    depends_on:
      srv-db-01:
        condition: service_healthy
      srv-php-fpm:
        condition: service_healthy
      srv-certbot:
        condition: service_healthy
    networks:
      # Tendrá que conectarse a la VLAN 40 y la VLAN 10 para acceder a los servicios
      # de PHP-FPM, la base de datos y certbot para el TLS.
      vlan40:
        ipv4_address: 10.0.40.2
      vlan10:
        ipv4_address: 10.0.10.7
    volumes:
      - type: bind
        source: ./web/srv-web-01
        target: /usr/share/nginx/html
        read_only: true
    ports:
      - "80:80"
    healthcheck:
      test: ["CMD-SHELL", "sudo nginx -t && curl -f http://localhost"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # Próximos servicios — Sprint 2 (pendientes de implementar)
  # ---------------------------------------------------------------------------
  # srv-web-02    (Nginx)     → ./web/
  # srv-web-03    (Nginx)     → ./web/
  # srv-dns-01    (BIND9)     → ./dns/
  # srv-smtp-01   (MailHog)   → ./smtp/
  # srv-dhcp-01   (dhcpd)     → ./dhcp/

# =============================================================================
# Redes — modelan la segmentación VLAN del diseño de red
# =============================================================================
networks:
  vlan10:
    name: vlan10_servidores
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.10.0/24
          gateway: 10.0.10.1

  vlan40:
    name: vlan40_dmz
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.40.0/24
          gateway: 10.0.40.1

# =============================================================================
# Volúmenes — para persistencia de datos y configuración
# =============================================================================
volumes:
  pgdata:
  samba_data:
