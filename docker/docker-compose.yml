# =============================================================================
# docker-compose.yml — Infraestructura TI SIG
# Unidad para la Atención y Reparación Integral a las Víctimas
# Universidad del Quindío — Semestre 2026-1
# =============================================================================
# Uso con Podman:
#   alias docker=podman
#   podman-compose up -d
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # srv-ntp-01 — Servidor NTP (chrony) (VLAN 10 — 10.0.10.4)
  # ---------------------------------------------------------------------------
  srv-ntp-01:
    build:
      context: ./ntp/
      dockerfile: Dockerfile
    container_name: srv-ntp-01
    hostname: srv-ntp-01
    restart: unless-stopped
    privileged: true
    cap_add:
      - SYS_TIME
    networks:
      vlan10:
        ipv4_address: 10.0.10.4
    expose:
      - "123"
    healthcheck:
      test: ["CMD-SHELL", "chronyc tracking | grep -i 'reference id'"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # srv-php-fpm — Servidor PHP-FPM (VLAN 10 — 10.0.10.8)
  # ---------------------------------------------------------------------------
  srv-php-fpm:
    build:
      context: ./web/srv-php-fpm
      dockerfile: Dockerfile
    container_name: srv-php-fpm
    hostname: srv-php-fpm
    restart: unless-stopped
    networks:
      backend:
    expose:
      - "9000"
    volumes:
      - type: bind
        source: ./web/srv-web-01/html
        target: /var/www/html/web01
        read_only: true
      - type: bind
        source: ./web/srv-web-02/html
        target: /var/www/html/web02
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # srv-db-01 — Servidor de Base de Datos (VLAN 10 — 10.0.10.2)
  # SSH: puerto 2222 — usuario uv_dbadmin — solo llave pública
  # ---------------------------------------------------------------------------
  srv-db-01:
    build:
      context: ./db
      dockerfile: Dockerfile
      args:
        SSH_PUBLIC_KEY: ${SSH_PUBLIC_KEY:-}
    depends_on:
      srv-ntp-01:
        condition: service_healthy
    container_name: srv-db-01
    hostname: srv-db-01
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
      PGTZ: ${PGTZ}
    volumes:
      - pgdata:/var/lib/postgresql/data:Z
      - ./db/init:/docker-entrypoint-initdb.d:ro,Z
    networks:
      vlan10:
        ipv4_address: 10.0.10.2
    expose:
      - "5432"
    ports:
      - "2222:2222"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # srv-files-01 — Servidor de Archivos (VLAN 10 — 10.0.10.3)
  # Samba SMB/CIFS | Share: /srv/uv_docs | Solo LAN, bloqueado desde DMZ
  # SSH: puerto 2222 interno → 2223 en host — usuario uv_admin — solo llave pública
  # ---------------------------------------------------------------------------
  srv-files-01:
    build:
      context: ./files
      dockerfile: Dockerfile
      args:
        SAMBA_GID: ${SAMBA_GID:-1050}
        SAMBA_UID: ${SAMBA_UID:-1050}
        SSH_PUBLIC_KEY: ${SSH_PUBLIC_KEY:-}
    depends_on:
      srv-ntp-01:
        condition: service_healthy
    container_name: srv-files-01
    hostname: srv-files-01
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      SAMBA_USER: ${SAMBA_USER}
      SAMBA_PASSWORD: ${SAMBA_PASSWORD}
      SAMBA_GROUP: g_files
      SAMBA_SHARE_PATH: /srv/uv_docs
    volumes:
      - samba_data:/srv/uv_docs:Z
    networks:
      vlan10:
        ipv4_address: 10.0.10.3
    expose:
      - "445"
    ports:
      - "2223:2222"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "testparm -s /etc/samba/smb.conf >/dev/null 2>&1 && pgrep smbd >/dev/null",
        ]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # srv-web-01 — Portal Ciudadano (VLAN 40 — 10.0.40.2, VLAN 10 — 10.0.10.7)
  # PHP-FPM a través de srv-php-fpm:9000
  # ---------------------------------------------------------------------------
  srv-web-01:
    image: docker.io/library/nginx:alpine
    container_name: srv-web-01
    hostname: srv-web-01
    restart: unless-stopped
    depends_on:
      srv-db-01:
        condition: service_healthy
      srv-php-fpm:
        condition: service_healthy
    networks:
      vlan40:
      backend:
    volumes:
      - type: bind
        source: ./web/srv-web-01/html
        target: /var/www/html
        read_only: true
      - type: bind
        source: ./web/srv-web-01/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    ports:
      - "8082:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1/index.php >/dev/null || wget -qO- http://127.0.0.1/ >/dev/null",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # srv-web-02 — RNI: Comunicaciones con organizaciones externas
  # (VLAN 40 — 10.0.40.5, VLAN 10)
  # PHP-FPM a través de srv-php-fpm:9000
  # ---------------------------------------------------------------------------
  srv-web-02:
    image: docker.io/library/nginx:alpine
    container_name: srv-web-02
    hostname: srv-web-02
    restart: unless-stopped
    depends_on:
      srv-db-01:
        condition: service_healthy
      srv-php-fpm:
        condition: service_healthy
    networks:
      vlan40:
      backend:
    volumes:
      - type: bind
        source: ./web/srv-web-02/html
        target: /var/www/html
        read_only: true
      - type: bind
        source: ./web/srv-web-02/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    ports:
      - "8083:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # srv-web-03 — Intranet SUMA (VLAN 10 — 10.0.10.5)
  # Servidor estático, sin PHP-FPM
  # ---------------------------------------------------------------------------
  srv-web-03:
    image: docker.io/library/nginx:alpine
    container_name: srv-web-03
    hostname: srv-web-03
    restart: unless-stopped
    networks:
      vlan10:
        ipv4_address: 10.0.10.5
    volumes:
      - type: bind
        source: ./web/srv-web-03/html
        target: /var/www/html
        read_only: true
      - type: bind
        source: ./web/srv-web-03/nginx.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # c
  # SSL/TLS, balanceo de carga y proxy reverso centralizado
  # ---------------------------------------------------------------------------
  srv-proxy-01:
    image: docker.io/jc21/nginx-proxy-manager:latest
    container_name: srv-proxy-01
    hostname: srv-proxy-01
    restart: unless-stopped
    depends_on:
      srv-web-01:
        condition: service_healthy
      srv-web-02:
        condition: service_healthy
      srv-web-03:
        condition: service_healthy
    networks:
      vlan40:
        ipv4_address: 10.0.40.6
    ports:
      - "8080:80"
      - "8443:443"
      - "8081:81"
    volumes:
      - type: bind
        source: ./web/proxy/data
        target: /data
      - type: bind
        source: ./web/proxy/letsencrypt
        target: /etc/letsencrypt
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:81/ >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # srv-dns-01 — Servidor DNS autoritativo (BIND9) (VLAN 40 — 10.0.40.3)
  # ---------------------------------------------------------------------------
  srv-dns-01:
    build:
      context: ./dns
      dockerfile: Dockerfile
    container_name: srv-dns-01
    hostname: srv-dns-01
    restart: unless-stopped
    networks:
      vlan40:
        ipv4_address: 10.0.40.3
    expose:
      - "53/tcp"
      - "53/udp"
    healthcheck:
      test: ["CMD-SHELL", "pgrep named >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # srv-smtp-01 — Servidor de Correo SMTP / MailHog (VLAN 40 — 10.0.40.4)
  # SMTP (submission) : 1025 — solo desde VLAN 10 y VLAN 20
  # Interfaz web      : 8025 — solo desde VLAN 20 (regla de firewall)
  # ---------------------------------------------------------------------------
  srv-smtp-01:
    build:
      context: ./smtp
      dockerfile: Dockerfile
    container_name: srv-smtp-01
    hostname: srv-smtp-01
    restart: unless-stopped
    environment:
      MH_SMTP_BIND_ADDR: "0.0.0.0:1025"
      MH_API_BIND_ADDR: "0.0.0.0:8025"
      MH_UI_BIND_ADDR: "0.0.0.0:8025"
      MH_STORAGE: "memory"
    networks:
      vlan40:
        ipv4_address: 10.0.40.4
    expose:
      - "587"
      - "8025"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://localhost:8025/api/v2/messages >/dev/null",
        ]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ---------------------------------------------------------------------------
  # srv-dhcp-01 — Servidor DHCP (VLAN 10 — 10.0.10.6)
  # Asigna IPs dinámicas a VLAN 20 (Administración) y VLAN 30 (Usuarios)
  # Conectado a las tres VLANs para simular el relay inter-VLAN
  # ---------------------------------------------------------------------------
  srv-dhcp-01:
    build:
      context: ./dhcp
      dockerfile: Dockerfile
    container_name: srv-dhcp-01
    hostname: srv-dhcp-01
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
      - NET_RAW
    networks:
      vlan10:
        ipv4_address: 10.0.10.6
    expose:
      - "67/udp"
      - "68/udp"
    healthcheck:
      test: ["CMD-SHELL", "pgrep dhcpd || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# =============================================================================
# Redes — modelan la segmentación VLAN del diseño de red
# =============================================================================
networks:
  vlan10:
    name: vlan10_servidores
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.10.0/24
          gateway: 10.0.10.1

  vlan20:
    name: vlan20_administracion
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.20.0/24
          gateway: 10.0.20.1

  vlan30:
    name: vlan30_usuarios
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.30.0/24
          gateway: 10.0.30.1

  vlan40:
    name: vlan40_dmz
    driver: bridge
    ipam:
      config:
        - subnet: 10.0.40.0/24
          gateway: 10.0.40.1

  backend:
    name: backend_phpfpm
    driver: bridge
    internal: true

# =============================================================================
# Volúmenes — para persistencia de datos y configuración
# =============================================================================
volumes:
  pgdata:
  samba_data: