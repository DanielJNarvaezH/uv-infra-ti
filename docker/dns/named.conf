// =============================================================================
// named.conf — Servidor DNS autoritativo (BIND9)
// Unidad para la Atención y Reparación Integral a las Víctimas
// Universidad del Quindío — Semestre 2026-1
// =============================================================================

options {
    directory "/var/cache/bind";

    // Escuchar en las interfaces de red locales
    listen-on { 10.0.40.3; 10.0.10.9; 127.0.0.1; };

    // Permitir consultas desde cualquier red (entorno de simulación local)
    allow-query { 
      10.0.10.0/24;   // vlan10
      10.0.20.0/24;   // vlan20
      10.0.30.0/24;   // vlan30
      10.0.40.0/24;   // vlan40
      127.0.0.1;
    };

    // Este servidor es autoritativo, no recursivo para clientes externos
    recursion no;

    // No permitir transferencias de zona
    allow-transfer { none; };

    // Desactivar notificaciones de zona
    notify no;

    // Versión oculta por seguridad
    version "not currently available";
};

// =============================================================================
// Zona directa: unidadvictimas.corp
// =============================================================================
zone "unidadvictimas.corp" {
    type primary;
    file "/etc/bind/zones/db.unidadvictimas.corp";
    notify no;
};

// =============================================================================
// Zona directa: uv.interno (resolución interna de servidores)
// =============================================================================
zone "uv.interno" {
    type primary;
    file "/etc/bind/zones/db.uv.interno";
    notify no;
};

// =============================================================================
// Zonas de resolución inversa (loopback y redes internas)
// =============================================================================
zone "0.0.127.in-addr.arpa" {
    type primary;
    file "/etc/bind/zones/db.127";
    notify no;
};
